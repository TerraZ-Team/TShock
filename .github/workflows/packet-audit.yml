name: Packet handler audit

on:
  push:
    branches: [ audit/packet-handlers-1.4.5.7 ]
    paths:
      - tools/packet_audit.py
      - tools/apply_packet_audit_fixes.py
      - .github/workflows/packet-audit.yml
      - TShockAPI/GetDataHandlers.cs
      - TerrariaServerAPI
  pull_request:
    branches: [ general-devel ]
    paths:
      - tools/packet_audit.py
      - .github/workflows/packet-audit.yml
      - TShockAPI/GetDataHandlers.cs
      - TerrariaServerAPI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply audited packet fixes
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'align packet handlers')
        run: python tools/apply_packet_audit_fixes.py
      - name: Commit audited fixes
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'align packet handlers')
        shell: bash
        run: |
          if git diff --quiet -- TShockAPI/GetDataHandlers.cs; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- TShockAPI/GetDataHandlers.cs
          git commit -m "fix: align packet handlers with Terraria 1.4.5.7"
          git push origin HEAD:audit/packet-handlers-1.4.5.7
      - name: Compare all registered handlers with Terraria 1.4.5.7
        run: python tools/packet_audit.py
      - name: Trace SSC packet gating
        run: |
          echo '=== IgnoreSSCPackets ==='
          git grep -n 'IgnoreSSCPackets' -- '*.cs' || true
          echo '=== HasSentInventory ==='
          git grep -n 'HasSentInventory' -- '*.cs' || true
          echo '=== packet 22 / ItemOwner sends ==='
          git grep -n -E 'PacketTypes\.ItemOwner|SendData\(22|TrySendData\(22' -- '*.cs' || true
          echo '=== SendItemSlotPacketFor ==='
          git grep -n 'SendItemSlotPacketFor' -- '*.cs' || true
      - name: Add report to job summary
        if: always()
        run: cat packet-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packet-audit
          path: |
            packet-audit.md
            packet-audit.json
