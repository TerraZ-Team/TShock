name: Publish NuGet

on:
  push:
    branches: [ general-devel ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Add MonoMod source
        run: dotnet nuget add source https://pkgs.dev.azure.com/MonoMod/MonoMod/_packaging/DevBuilds%40Local/nuget/v3/index.json -n DevBuilds@Local

      - name: Restore dependencies
        run: dotnet restore TShock.sln

      - name: Build
        run: dotnet build TShock.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TShock.sln --no-build --verbosity normal --configuration Release

      - name: Pack TZ.TShockAPI
        run: dotnet pack TShockAPI/TShockAPI.csproj --configuration Release --no-build --output artifacts/nuget

      - name: Push TZ.TShockAPI
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/nuget/TZ.TShockAPI.*.nupkg | Select-Object -First 1
          if (-not $package) {
            throw "TZ.TShockAPI package was not produced."
          }
          dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
